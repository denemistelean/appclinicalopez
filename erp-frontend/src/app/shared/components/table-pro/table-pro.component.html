<div class="vista">
  <div class="vista-encabezado">
    <h2>{{ titulo }}</h2>
    @if (subtitulo) { <p>{{ subtitulo }}</p> }
  </div>

  @if (!hideSearch || showAddBtn) {
    <div class="vista-filtros">
      @if (!hideSearch) {
        <label class="vista-campo">
          <span><i class="bi bi-search"></i> Buscar</span>
          <input [formControl]="searchControl" [placeholder]="searchPlaceholder" (input)="onSearchInput($event)">
        </label>
      }
      @if (showAddBtn) {
        <button type="button" class="vista-nuevo" (click)="onAddClick($event)">
          <i class="bi bi-plus-lg"></i> {{ btnText }}
        </button>
      }
    </div>
  }

  <div class="vista-tabla">
    @if (loading) {
      <div class="progress table-loading-bar">
        <div class="progress-bar progress-bar-striped progress-bar-animated w-100"></div>
      </div>
    }

    <div class="table-responsive custom-scroll">
      <table class="table table-hover align-middle mb-0" [class.opacity-50]="loading">
        <ng-content select="[thead]"></ng-content>
        <ng-content select="[tbody]"></ng-content>
      </table>
    </div>

    @if (meta.total > 0) {
      <div class="vista-pie">
        <span>Mostrando {{ data.length }} de {{ meta.total }} registros</span>
        <ngb-pagination
          [collectionSize]="meta.total"
          [page]="meta.page"
          [pageSize]="meta.limit"
          (pageChange)="pageChange.emit($event)"
          [maxSize]="3"
          [rotate]="true"
          [ellipses]="false"
          [boundaryLinks]="false"
          class="mb-0">
        </ngb-pagination>
      </div>
    }
  </div>
</div>
